services:
  # FastAPI Backend Web Service on Render
  - type: web
    name: onion-quality-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VISION_AI_ENABLED
        value: "true"
      - key: VISION_PROVIDER
        value: "gemini"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-1.5-flash"
      - key: VISION_AI_CONFIDENCE_THRESHOLD
        value: "0.85"
      - key: VISION_AI_ONLY_ON_DISAGREEMENT
        value: "true"

  # Frontend Static Site on Render
  - type: web
    name: onion-quality-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_AI_API_URL
        fromService:
          type: web
          name: onion-quality-backend
          property: host
